spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-id
            client-secret: test-github-secret
          google:
            client-id: test-google-id
            client-secret: test-google-secret

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-32chars
    expiration-days: 7
  cors:
    allowed-origins: http://localhost:4200
  openai:
    api-key: test-openai-key
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
  plans:
    free:
      max-jobs: 50
    pro:
      max-ai-generations-per-month: 30

logging:
  level:
    br.com.vagasflow: WARN
    org.springframework.security: WARN